# ユーザー名
NotBlank.User.name=名前を入力してください
Max.User.name=名前は10文字以下を入力してください
# メールアドレス
NotBlank.User.email=メールアドレスを入力してください
# 年齢
NotNull.User.age=年齢を入力してください
Max.User.age=正しい年齢を入力してください
