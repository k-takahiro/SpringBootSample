<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link th:href="@{styles.css}" rel="stylesheet">
  <script type="text/javascript" src="/main.js"></script>
  <title>利用者情報登録画面</title>
</head>
<table>
  <tr>
    <td><a href="#">利用者情報登録</a></td>
    <td><a href="userList.html" th:href="@{/userList}">利用者一覧</a></td>
  </tr>
</table>

<body>
  <form th:action="@{/accountCreateFrom}" th:object="${user}" method="post">
    <table th:if="${validationError}">
      <tr th:each="error : ${validationError}">
        <td style="color: red;" th:text="${error}"></td>
      </tr>
    </table>
    <label for="name">氏名：</label>
    <input type="text" th:field="*{name}"><br>

    <label for="email">E-Mail：</label>
    <input type="email" th:field="*{email}"><br>

    <label for="age">年齢：</label>
    <input type="number" th:field="*{age}"><br>

    <label for="inputDate">利用開始日：</label>
    <input type="date" id="today" th:field="*{inputDate}"><br>

    <label for="phone">電話番号：</label>
    <input type="text" id="phone" placeholder="(例) 080-777-777"><br>

    <label for="userId">ユーザID：</label>
    <input type="text" th:field="*{userId}"><br>

    <label for="password">パスワード:</label>
    <input type="password" id="password" name="password" th:field="*{password}"><br>
    <br>

    <button>確認画面へ</button>
  </form>
</body>
<script th:inline="javascript">
  var today = new Date();
  today.setDate(today.getDate());
  var yyyy = today.getFullYear();
  var mm = ("0" + (today.getMonth() + 1)).slice(-2);
  var dd = ("0" + today.getDate()).slice(-2);
  document.getElementById("today").value = yyyy + '-' + mm + '-' + dd;

</script>

</html>
