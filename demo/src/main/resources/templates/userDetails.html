<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<body>
  <div>
    <h3>利用者情報詳細画面</h3>
    <div>
      <table border="1" style="border-collapse: collapse" cellpadding="4">
        <thead>
          <tr>
            <th>ID</th>
            <th>氏名</th>
            <th>メールアドレス</th>
            <th>年齢</th>
            <th>利用開始日</th>
            <th>電話番号</th>
            <th>ユーザID</th>
            <th>パスワード</th>
            <th>登録日時</th>
            <th>更新日時</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user: ${userDetails}">
            <td th:text=${user.id}></td>
            <td th:text=${user.name}></td>
            <td th:text=${user.email}></td>
            <td th:text=${user.age}></td>
            <td th:text=${user.inputDate}></td>
            <td th:text=${user.user_phone}></td>
            <td th:text=${user.userId}></td>
            <td th:text=${user.password}></td>
            <td th:text=${user.user_insert_date}></td>
            <td th:text=${user.user_update_date}></td>
          </tr>
        </tbody>
      </table>
    </div>
    <a href="/user/list">一覧に戻る</a>
  </div>
</body>

</html>
