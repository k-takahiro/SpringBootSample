<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<body>
  <div class="container">
    <h3>ユーザー情報詳細画面</h3>
    <div class="list">
      <table id="table" class="table table-striped table-hover">
        <thead class="thead-lignt">
          <tr>
            <th class="col-2">ID</th>
            <th class="col-2">氏名</th>
            <th class="col-2">メールアドレス</th>
            <th class="col-2">年齢</th>
            <th class="col-2">利用開始日</th>
            <th class="col-2">電話番号</th>
            <th class="col-2">ユーザID</th>
            <th class="col-2">パスワード</th>
            <th class="col-2">登録日時</th>
            <th class="col-2">更新日時</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user: ${userDetails}">
            <td th:text=${user.id}></td>
            <td th:text=${user.name}></td>
            <td th:text=${user.email}></td>
            <td th:text=${user.age}></td>
            <td th:text=${user.inputDate}></td>
            <td th:text=${user.user_phone}></td>
            <td th:text=${user.userId}></td>
            <td th:text=${user.password}></td>
            <td th:text=${user.user_insert_date}></td>
            <td th:text=${user.user_update_date}></td>
          </tr>
        </tbody>
      </table>
    </div>
    <a href="/user/list">一覧に戻る</a>
  </div>
</body>

</html>
