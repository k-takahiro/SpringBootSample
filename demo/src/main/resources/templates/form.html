<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link th:href="@{styles.css}" rel="stylesheet">
  <title>利用者登録画面</title>
</head>
<table>
  <tr>
    <td><a href="#">利用者入力</a></td>
    <td><a href="userList.html" th:href="@{/userList}">利用者一覧</a></td>
    <td><a href="insert.html" th:href="@{/insert}">家計簿登録</a></td>
    <td><a href="#">家計簿一覧</a></td>
    <td><a href="#">更新</a></td>
    <td><a href="#">削除</a></td>
  </tr>
</table>

<body>
  <form th:action="@{/form}" th:object="${user}" method="post">
    <table th:if="${validationError}">
      <tr th:each="error : ${validationError}">
        <td style="color: red;" th:text="${error}"></td>
      </tr>
    </table>
    <label for="name">氏名：</label>
    <input type="text" th:field="*{name}"><br>

    <label for="email">E-Mail：</label>
    <input type="email" th:field="*{email}"><br>

    <label for="age">年齢：</label>
    <input type="number" th:field="*{age}"><br>

    <label for="inputDate">利用開始日：</label>
    <input type="date" id="today" th:field="*{inputDate}"><br>

    <!-- TODO:エクリプスのコンパイラーのように存在しない変数、メソッドにエラーを表示させたい  -->
    <label for="phone">電話番号：</label>
    <input type="text" id="phone" placeholder="(例) 080-777-777" oninput="checkPassword()"><br>

    <label for="userId">ユーザID：</label>
    <input type="text" th:field="*{userId}"><br>

    <label for="password">パスワード:</label>
    <input type="password" id="password" name="password" th:field="*{password}"><br>

    <!-- TODO:入力したパスワード再確認をここに配置  -->
    <!-- パスワードのバリデーションがOKになるまで、・非活性にしたい、 ・比較元との完全一致-->
    <!-- パスワード完全一致について、（spring徹底入門の228ページ付近）　　これが独自のバリデータで相関チェックのようである。 -->

    <!-- セレクトボックスの出力については、「spring徹底入門の263ページ付近」がヒントかもだが、
     アクション（ボタン押下）を境にリストの初期化はbeanObjectの理解も手掛かりかも -->
    <label for="itemKind">都道府県：</label>
    <select>
      <option value="">---</option>
      <option th:each="itemKind : ${itemKindMap}" th:value="${itemKind.key}" th:text="${itemKind.value}"
      th:selected="${itemKind.key == selectedValue}">
    </select>
    <br>

    <!-- 生年月日を記載する欄をここに配置する。セレクトボックス、生年月日はネットで情報が多いためリストの初期化の解消にもつながりそう。
    まずは、シンプル（初期値などがプログラムへ直書きのもの）なものを参考にさせてもらう。jsでの非同期処理（ajax）やリストの動的変化は今後。。
     https://qiita.com/parapore/items/22ca680ed8b487b4bea1 
    -->
    <label for="dateOfBirth">生年月日：</label>
      <select>
        <option th:each="birthYear : ${birthYearList}"
                th:value="${birthYear}"
                th:text="${birthYear}"
                th:selected="${birthYear.equals(birthYearDefault)}">
        </option>
    </select>
    <br>
    <select>
      <option th:each="birthYear : ${mmddList}"
              th:value="${birthYear}"
              th:text="${birthYear}"
              th:selected="${birthYear.equals(birthYearDefault)}">
      </option>
  </select>
  <br>
    <button>確認画面へ</button>
  </form>
</body>
<script th:inline="javascript">
  var today = new Date();
  today.setDate(today.getDate());
  var yyyy = today.getFullYear();
  var mm = ("0" + (today.getMonth() + 1)).slice(-2);
  var dd = ("0" + today.getDate()).slice(-2);
  document.getElementById("today").value = yyyy + '-' + mm + '-' + dd;

</script>

</html>
