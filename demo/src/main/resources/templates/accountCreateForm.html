<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>利用者情報登録画面</title>
</head>

<body>
  <form th:action="@{/accountCreateForm}" th:object="${user}" method="post">
    <table th:if="${validationError}">
      <tr th:each="error : ${validationError}">
        <td style="color: red;" th:text="${error}"></td>
      </tr>
    </table>
    <label for="name">氏名：</label>
    <input type="text" th:field="*{name}"><br>

    <label for="email">E-Mail：</label>
    <input type="email" th:field="*{email}"><br>

    <label for="age">年齢：</label>
    <input type="number" th:field="*{age}"><br>
    <br>

    <button>確認画面へ</button>
  </form>
</body>

</html>
