<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Hello</title> <!-- メッセージの外部化 -->
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>

<body>
    <div id="form">
        <p class="form-title" th:text="#{common.Login}"></p>
        <div style="color: red;" th:text="${message}"></div>
        <form action="/login" method="post">
            <!-- ユーザID -->
            <div class="userId">
                <label for="userId" th:text="#{common.UserId}"></label>
                <input type="text" id="userId" name="userId" th:value="${userId}">
            </div>
            <!-- パスワード -->
            <div class="password">
                <label for="password" th:text="#{common.Password}"></label>
                <input type="password" id="password" name="password" th:value="${password}">
            </div>
            <button type="submit">ログイン</button>
        </form>
        <a th:href="@{'/accountCreateFormView'}">アカウント作成はこちら</a>
        <br>
    </div>
</body>

</html>
<style>
    body,
    p,
    form,
    input {
         margin: 0;
    }

    #form {
        width: 400px;
        margin: 30px auto;
        padding: 20px;
        border: 1px solid #555;
    }

    form p {
        font-size: 14px;
    }

    .form-title {
        text-align: center;
    }

    .userId,
    .password {
        margin-bottom: 20px;
    }

    input[type="text"],
    input[type="password"] {
        width: 200px;
        padding: 4px;
        font-size: 12px;
    }

    /* ここから追記部分 */
label {
    display: inline-block;
    width: 100px;
    vertical-align: top;
}
</style>
