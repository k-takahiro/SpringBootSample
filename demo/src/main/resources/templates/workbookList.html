<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Bookmark一覧画面</title>
</head>
<body>
    <h3>Bookmark一覧たち</h3>
</body>

		<!--入力した値をth:object="${formModel}"に詰める  -->
		<!--th:valueで初期値が入るようにする  -->
		<form method="post" th:action="@{/book}" th:object="${formModel}">
			<label>タイトル:</label>
			<input type="text" name="title" th:value="*{title}"><p>
			<input type="submit" value="検索">
		</form>

<div>
    <table border="1" style="border-collapse: collapse" cellpadding="2">
      <thead>
        <tr>
          <th>タイトル</th>
          <!-- <th>リンク</th> -->
          <th>分類</th>
          <!-- <th>登録日時</th>
          <th>更新日時</th> -->
        </tr>
      </thead>
      <tbody>
        <tr th:each="workbook: ${workbookList}">
          <td th:text=${workbook.title}></td>
          <!-- <td th:text=${workbook.link}></td> -->
          <td th:text=${workbook.category}></td>
          <!-- <td th:text=${workbook.insert_date}></td>
          <td th:text=${workbook.update_date}></td> -->
        </tr>
      </tbody>
    </table>
  </div>
</html>
