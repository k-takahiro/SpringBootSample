<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>入力内容確認画面</title>
</head>

<body>
  <div th:object="${user}"></div>
  <p>入力内容をご確認ください</p>
  <span th:inline="text">
    氏名： [[${user.name}]]<br>
    E-Mail： [[${user.email}]]<br>
    年齢： [[${user.age}]]<br>
    日付： [[${user.inputDate}]]<br>
    電話番号： [[${user.user_phone}]]<br>
    ユーザID： [[${user.userId}]]<br>
    パスワード： [[${user.password}]]<br>
  </span>
  <form method="post" action="#" th:action="@{form}">
    <input type="hidden" name="name" th:value="*{name}">
    <input type="hidden" name="email" th:value="*{email}">
    <input type="hidden" name="age" th:value="*{age}">
    <input type="hidden" name="inputDate" th:value="*{inputDate}">
    <input type="hidden" name="user_phone" th:value="*{user_phone}">
    <input type="hidden" name="userId" th:value="*{userId}">
    <input type="hidden" name="password" th:value="*{password}">
    <input type="submit" value="戻る">
  </form>

  <form th:action="@{/userInfoInsert}" th:object="${user}" method="post">
    <input type="hidden" name="name" th:value="*{name}">
    <input type="hidden" name="email" th:value="*{email}">
    <input type="hidden" name="age" th:value="*{age}">
    <input type="hidden" name="inputDate" th:value="*{inputDate}">
    <input type="hidden" name="user_phone" th:value="*{user_phone}">
    <input type="hidden" name="userId" th:value="*{userId}">
    <input type="hidden" name="password" th:value="*{password}">
    <input type="submit" value="登録">
  </form>
  </div>

</body>

</html>
